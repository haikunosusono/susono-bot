name: 俳句の裾野 つぶやき
on:
  schedule:
    # 時刻は UTC（日本時間 = UTC + 9時間）。GitHubの都合で、数分〜数十分おくれることがあります
    # 句会の時間割：毎晩21時「すその句会」＋23時「おかわり句会」。土・日・祝日は10時・13時・15時も
    # （昼の分は毎日動かして、平日は post.js が「きょうは回がない」と判断して、投稿せずに終わります）
    - cron: '0 22 * * *'      # 毎朝 7:00  今日の兼題・機能紹介（定例句会のご案内つき）
    - cron: '0 10 * * *'      # 19:00  今日の機能紹介（毎日ひとつ・30日でひとまわり）
    - cron: '0 0 * * *'       # 9:00   10時の回まで「あと1時間」（土日祝だけ投稿される）
    - cron: '0 3 * * *'       # 12:00  13時の回まで「あと1時間」（同上）
    - cron: '0 5 * * *'       # 14:00  15時の回まで「あと1時間」（同上）
    - cron: '0 11 * * *'      # 20:00  21時「すその句会」まで「あと1時間」（毎日）
    - cron: '0 13 * * *'      # 22:00  23時「おかわり句会」まで「あと1時間」（毎日）
    - cron: '0 1 * * *'       # 10:00  「はじまりました」（変数 TEI_POSTS に start を入れたときだけ投稿）
    - cron: '0 4 * * *'       # 13:00  同上
    - cron: '0 6 * * *'       # 15:00  同上
    - cron: '0 12 * * *'      # 21:00  同上
    - cron: '0 14 * * *'      # 23:00  同上
    - cron: '10 12 * * *'     # 21:10  21時「すその句会」の実況（句を出した人が1人以上のときだけ。0:00の分が間に合わなかったときの、2回目）
    - cron: '30 2 * * *'      # 11:30  10時の回のお礼（土日祝だけ投稿される）
    - cron: '30 5 * * *'      # 14:30  13時の回のお礼（同上）
    - cron: '30 7 * * *'      # 16:30  15時の回のお礼（同上）
    - cron: '30 13 * * *'     # 22:30  21時「すその句会」のお礼（毎日）
    - cron: '30 15 * * *'     # 翌0:30 23時「おかわり句会」のお礼（毎日）
    - cron: '0 15 * * *'      # 翌0:00  25時「よなよな句会」まで「あと1時間」（毎日）
    - cron: '0 16 * * *'      # 翌1:00  同上「はじまりました」（変数 TEI_POSTS に start を入れたときだけ）
    - cron: '30 17 * * *'     # 翌2:30  25時「よなよな句会」のお礼（毎日）
    # ↓ 念のための2回目（12分あと）。上の回がGitHub側で動かなかったときの保険。ふだんは「投稿ずみ」で何もしません
    - cron: '12 22 * * *'
    - cron: '12 10 * * *'
    - cron: '12 0 * * *'
    - cron: '12 3 * * *'
    - cron: '12 5 * * *'
    - cron: '12 11 * * *'
    - cron: '12 13 * * *'
    - cron: '12 1 * * *'
    - cron: '12 4 * * *'
    - cron: '12 6 * * *'
    - cron: '12 12 * * *'
    - cron: '12 14 * * *'
    - cron: '22 12 * * *'
    - cron: '42 2 * * *'
    - cron: '42 5 * * *'
    - cron: '42 7 * * *'
    - cron: '42 13 * * *'
    - cron: '42 15 * * *'
    - cron: '12 15 * * *'
    - cron: '12 16 * * *'
    - cron: '42 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 なら投稿せず文面だけ確認'
        default: '1'
      kind:
        description: 'auto（いまの時刻で決める）/ daily / feature / announce / start / thanks / custom'
        default: 'auto'
      text:
        description: 'custom のときの文（改行は \\n）'
        default: ''
jobs:
  tweet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: つぶやく
        id: tweet
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          INCLUDE_LINK: ${{ vars.INCLUDE_LINK || '1' }}
          TEI_POSTS: ${{ vars.TEI_POSTS }}
          TEI_LIVE: ${{ vars.TEI_LIVE }}
          KIND: ${{ github.event.inputs.kind || 'auto' }}
          TEXT: ${{ github.event.inputs.text }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
        run: node post.js
      - name: 失敗したら、3分後にもう一度（投稿ずみなら何もしない）
        if: steps.tweet.outcome == 'failure'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          INCLUDE_LINK: ${{ vars.INCLUDE_LINK || '1' }}
          TEI_POSTS: ${{ vars.TEI_POSTS }}
          TEI_LIVE: ${{ vars.TEI_LIVE }}
          KIND: ${{ github.event.inputs.kind || 'auto' }}
          TEXT: ${{ github.event.inputs.text }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
        run: |
          sleep 180
          node post.js
