name: AI先生の点検
on:
  schedule:
    # 定例句会のあと、日本時間で 夜 22:30・0:30・2:30 と、昼 11:30・14:30・16:30（休日・祝日の昼の3回。平日は「なし」と出ます）
    - cron: '30 13 * * *'
    - cron: '30 15 * * *'
    - cron: '30 17 * * *'
    - cron: '30 2 * * *'
    - cron: '30 5 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 点検する
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/ai-check.js
