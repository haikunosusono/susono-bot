name: 看護ナビ・句帳 のデプロイ
# apps/ の中が変わったら、Firebase Hosting の別サイトに反映します。
#   apps/kango-navi   → https://kango-navi.web.app
#   apps/ninnin-kucho → https://ninnin-kucho.web.app
# 動かすには、GitHubのSecretsに FIREBASE_SERVICE_ACCOUNT が必要です（裾野と同じもの）。
on:
  push:
    branches: [main]
    paths: ['apps/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: サイトを用意して反映する
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools@13 --no-audit --no-fund
          for d in kango-navi ninnin-kucho; do
            echo "== $d =="
            firebase hosting:sites:create "$d" --project haikunosusono --non-interactive || echo "（サイトはもうあります）"
            (cd "apps/$d" && firebase deploy --only hosting --project haikunosusono --non-interactive)
          done
          rm -f "$RUNNER_TEMP/sa.json"
