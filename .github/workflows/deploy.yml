name: 俳句の裾野 アプリのデプロイ
# app/ の中が変わったら、自動で haikunosusono.web.app に反映します（画面と、Firestoreのルールの両方）。
# 動かすには、GitHubのSecretsに FIREBASE_SERVICE_ACCOUNT（Firebaseのサービスアカウントの鍵JSON）が必要です。
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: haikunosusono
          channelId: live
          entryPoint: app
      - name: Firestoreのルールを反映
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd app && npx --yes firebase-tools@13 deploy --only firestore:rules --project haikunosusono --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
