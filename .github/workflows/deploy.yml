name: 俳句の裾野 アプリのデプロイ
# app/ の中が変わったら、自動で haikunosusono.web.app に反映します（画面と、Firestoreのルールの両方）。
# 動かすには、GitHubのSecretsに FIREBASE_SERVICE_ACCOUNT（Firebaseのサービスアカウントの鍵JSON）が必要です。
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 画面をデプロイ（Firebase Hosting）
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd app && npx --yes firebase-tools@13 deploy --only hosting --project haikunosusono --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Firestoreのルールを反映（失敗しても、画面の反映はそのまま）
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd app
          set +e
          npx --yes firebase-tools@13 deploy --only firestore:rules --project haikunosusono --non-interactive > "$RUNNER_TEMP/rules.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/rules.log"
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $rc -ne 0 ]; then echo "::error title=rules::$(grep -iE 'error|denied|permission|invalid|line' "$RUNNER_TEMP/rules.log" | tail -n 8 | tr '\n' ' ' | cut -c1-900)"; exit 1; fi
          echo "::notice title=rules::ルールを反映しました"
