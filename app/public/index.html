<title>俳句の裾野</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* 一列の縦長。日替わりの一字題を上に置き、「ひとり（研鑽）」と「みんな（投句・選句）」を切り替える */
:root {
  --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --bg: #f6f1e7;
  --paper: #fffdf8;
  --ink: #2a2520;
  --ink-soft: #5d564c;
  --line: #e0d7c8;
  --accent: #1f7a63;
  --accent-ink: #ffffff;
  --accent-soft: #ddefe6;
  --accent2: #d96a2e;
  --accent2-soft: #fbe8d8;
  --tile1: #e9f4ec; --tile2: #fdf0dd; --tile3: #eef0fb; --tile4: #fdeaea;
  --warn: #8f5a0c;
  --warn-soft: #f4e6cc;
  --info: #35568a;
  --info-soft: #dbe4f2;
  --muted-soft: #e3e6e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131925; --paper: #1c2434; --ink: #e6e9ee; --ink-soft: #a5aebb; --line: #2c364a;
    --accent: #58c1a8; --accent-ink: #0c1a16; --accent-soft: #1c3a34;
    --accent2: #f09c62; --accent2-soft: #41301f;
    --tile1: #1d332a; --tile2: #3a2f1c; --tile3: #242c48; --tile4: #3b2428;
    --warn: #e0a550; --warn-soft: #3a2f1a; --info: #8fb0e8; --info-soft: #1f2c44; --muted-soft: #232c3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131925; --paper: #1c2434; --ink: #e6e9ee; --ink-soft: #a5aebb; --line: #2c364a;
  --accent: #58c1a8; --accent-ink: #0c1a16; --accent-soft: #1c3a34;
  --accent2: #f09c62; --accent2-soft: #41301f;
  --tile1: #1d332a; --tile2: #3a2f1c; --tile3: #242c48; --tile4: #3b2428;
  --warn: #e0a550; --warn-soft: #3a2f1a; --info: #8fb0e8; --info-soft: #1f2c44; --muted-soft: #232c3d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.75; padding-inline: 16px; }
.wrap { max-width: 680px; margin-inline: auto; padding-block: 20px 64px; display: flex; flex-direction: column; gap: 18px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.brand { margin: 0; font-family: var(--sans); font-weight: 700; font-size: 2rem; letter-spacing: .08em; line-height: 1.3; color: var(--accent); }
.tagline { font-size: .95rem; font-weight: 700; letter-spacing: .08em; color: var(--accent2); }
.date { font-family: var(--sans); font-size: 1.05rem; color: var(--ink-soft); }
.streak { font-size: .85rem; font-weight: 700; padding: .15em .8em; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { min-height: 44px; border: 0; background: var(--paper); font-weight: 700; cursor: pointer; }

.today .ch { font-family: var(--serif); font-weight: 700; font-size: 5rem; line-height: 1.15; overflow-wrap: anywhere; }

.ku { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 500; font-size: 1.2rem; line-height: 2; letter-spacing: .1em; }
.ku .seg { display: inline; }
.pv { max-width: none; }
.rem { font-weight: 700; font-size: .85rem; padding: .1em .75em; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.wel { display: flex; flex-direction: column; gap: 14px; }
.w3 { margin-left: calc(2.4rem + 10px); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
.w3 > b { color: var(--accent); }
.w3 > small { color: var(--ink-soft); }

.w3r div { display: flex; flex-direction: column; gap: 2px; font-weight: 700; }
.w3r i { font-style: normal; color: var(--accent); }
.w3r small { font-weight: 400; color: var(--ink-soft); font-size: .72rem; }
.wans { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.wme { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: .5em 1.1em; border-radius: 14px 14px 4px 14px; }
textarea { width: 100%; min-height: 8rem; padding: .6em .7em; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: inherit; color: inherit; box-sizing: border-box; resize: vertical; }

.tmr-bar { height: 6px; background: var(--muted-soft); border-radius: 99px; overflow: hidden; }

.stmemo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

.stm { margin: 2px 0 0; font-size: .8rem; color: var(--ink-soft); font-family: var(--sans); letter-spacing: 0; writing-mode: horizontal-tb; }
.k5lb { margin: 8px 0 4px; font-weight: 700; font-size: .85rem; }

.k5t { min-height: 52px; border: 2px solid transparent; border-radius: 10px; font-family: var(--serif); font-size: 1.25rem; font-weight: 700; cursor: pointer; color: #2b2418; }

.goon { margin: 8px 0; }

.goontabs { gap: 6px; margin: 6px 0; }
.goontabs .chip { flex: none; }

.k5pd { margin: 8px 0 2px; font-weight: 700; font-size: .85rem; color: var(--accent); }
.k5ws { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--serif); }
.k5 { list-style: none; padding: 0; margin: 6px 0; max-height: 280px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.k5 li { display: flex; gap: .8em; align-items: baseline; padding: 4px 10px; border-bottom: 1px dotted var(--line); }

.kgbox { margin: 8px 0; }

.mw { margin: 0; text-align: right; font-size: .85rem; color: var(--ink-soft); }

.note.src { font-size: .78rem; }

.kex { font-family: var(--serif); font-size: 1.25rem; letter-spacing: .06em; padding: 8px 4px; }

    ['自分の句は、ほかの人に見えますか？', '俳句の初心者部屋・俳筋力トレーニング部屋の記録（ストッ句）は、自分だけが見られます。句会に出した句は、オープンのあとに、その句会の参加者に見えます。仲間と句会の句は、参加している人だけに見えます。'],
    ['連続日数は、どう数えますか？', '句を記録した日が、とぎれずに続いた日数です。その日の句をまだ記録していなければ、昨日までの日数が出ます。'],
    ['ひとりで句会で作った句は、残りますか？', '残ります。ひとりで句会で出した句は、出どころつきで「ストッ句」に入り、参加した句会としても数えられます。自分とボット（2〜4名）の句会で、招待も見学もありません。'],
    ['一日に、何句まで入れられますか？', '「初心者部屋」は、1日に何句でも。「俳筋トレ」は、兼題ごとに1日1句です。トップの「✏️ 俳句のタネあつめ」メモも何こでも書けて、「ストッ句へ」でストッ句に入れられます（あとで推敲つき）。句づくりや句会で詠んだ句も、ストッ句に残ります。'],
    ['定例句会は、何時にはじまりますか？', '平日は、夜9時（21時）の「だれでも句会」と、夜11時（23時）の「おかわり句会」と、夜中1時（25時）の「よなよな句会」。土・日・祝日は、あさ10時の「おはよう句会」・13時の「こんにちは句会」・15時の「おやつの句会」です（日本時間・休日の夜はおやすみ）。投句はいつでもでき、定刻でしめきりです。句を出した人のページが開いていれば、定刻に自動ではじまります。だれも出さなかった回は、ひらかれません。'],
    ['ひとりしかいないときは、どうなりますか？', '定刻のとき、句を出した人が1人ならボット2名、2人ならボット1名が加わって、3句でひらきます。3人からは、人だけでひらきます。ボットの句は、あらかじめ用意した句です。ボットの選評も、決まった言いまわしでお伝えします。'],
    ['句会にかかる時間は、どれくらいですか？', '定例句会は、3句なら、定刻から約25分です。選句が約10分、合評は一句ごとに約5分、オープンのあとは約10分で閉会します。全員が選び終えたり、「この句をおわって、次へ」を押したりすると、早まります。'],
    ['参加した句会の回数は、どう数えますか？', '定例句会は、はじまった回に句を出していれば、1回です。仲間と句会は、参加した部屋ごとに1回。ひとりで句会は、最後まで遊ぶごとに1回です。マイページに「回 句会に参加」として出ます。'],
    ['句会がはじまりません。', '定例句会は、定刻に、句を出した人のページで自動ではじまります。句を出したら、ページを開いたままお待ちください。ページを閉じていると、はじまりません（もう一度ひらくと、すぐはじまります）。「仲間と句会」は、幹事の進行ボタンかタイマーで進みます。'],
    ['句読点や、一字あけは使えますか？', '使えます。句読点（、。）や、あえての一字あけ（空白）は、入力したとおりに表示されます。空白は、一字ぶんの間として出ます。ただし、一番はじめと一番おわりの空白は、取り除きます。字数の目安には、句読点と空白を入れていません。'],
    ['句会の見学だけでもできますか？', '定例句会なら、できます。トップの「いま、句会が開かれています」や、定例句会のロビーから、はじめから終わりまで、見るだけで入れます。句を出したり、選んだり、選評を送ったりはできません。見るだけの人にも、ほかの人の句や選評を、本人の了解なしに公開することは、禁止です。仲間と句会は、見学できません。'],
    ['俳号は、あとから変えられますか？', '変えられます。句を出す欄で、いつでも直せます。オープンまでは、作者は伏せられます。'],

    ['通知は届きますか？', '句会が進むたびに、画面のお知らせ・音・振動・（ブラウザが許せば）通知でお知らせします。ページを閉じていると届きません。'],
    ['トロフィーやバッジは、どうすればもらえますか？', '句会で最高点をとるとトロフィー、句を重ねたり、続けたり、いろいろな書き方や時間に挑戦したりすると、バッジ（90種類ほど）がもらえます。はじめての方には、「はじめの一歩」のバッジを用意しています。マイページのマイ統計に飾られ、「もうすこしで」で次のめあても出ます。'],
    ['自分の句を、Xなどに投稿できますか？', '「記録」の句と、句会の結果にある自分の句に、「画像にして投稿」のボタンがあります。縦書きの画像カード（俳号入り・ハッシュタグ #俳句の裾野 つき）をつくり、そのままXなどに共有できます。人の句は、作者本人だけが画像にできます。'],
    ['定例句会と、仲間と句会は、見え方がちがいますか？', 'はい。【定例句会】平日21時・23時・25時、土日祝10時・13時・15時の定例で、はじめから終わりまで、だれでも見学できます。終わった句会は、参加した人だけが、句会アーカイブから見られます。【仲間と句会】一覧に出るのは、参加している人だけで、見学はできません。ひらいた人のリンクから、集まり中のあいだに参加します。どちらも、終わると一覧から消えて、句会アーカイブに残ります。'],
    ['終わった句会は、どこで見られますか？', '「句会アーカイブ」（マイページ・メニューから）に残ります。そこから、結果をいつでもひらけます。参加した人だけが見られます。'],
    ['句会で出した句は、ストッ句に入りますか？', 'はい。定例句会も、仲間と句会も、ひとりで句会も、出した句は、出どころ（句会の名前と題）つきで、ストッ句に自動で入ります。ストッ句から消しても、もう一度は入りません。'],
    ['合言葉って、なんですか？', '仲間と句会の集まり方のひとつです。部屋をつくるときに合言葉を決めると、仲間は「仲間と句会」の「部屋に入る」で、同じ合言葉を入れるだけで、同じ部屋に入れます。部屋の外の人には見えません。仲間うちだけで通じる言葉にしてください。招待リンクでも入れます。'],

      '<h3>1. 俳句の初心者部屋（一日一句・日記のように）</h3><p>お題はありません。今日の気づきや気分を、一日一句、日記のように残す部屋です。テーマに合わない句でも、季語がなくても、字余りでも大丈夫。記録は自分だけが見られます。</p>' +

      '<h3>今日の一句（名句）</h3><p>トップに、季節の名句が開くたびにちがう一句。芭蕉・蕪村・一茶から、子規・虚子・山頭火・放哉・久女・蛇笏・三鬼まで（著作権の切れた俳人）。作者と出典つき。</p>' +
      '<h3>ストッ句のメモ・書き足し</h3><p>ストッ句の句に「📝メモ」（入選・掲載・詞書など）を書けます。外で詠んだ句や大会に出した句は「＋ 句を書き足す」から入れられます。入るのは自分の句だけです。</p>' +
      '<h3>連作の部屋</h3><p>ストッ句の句を並べて、ひとつの連作に。題と、目ざす句数（大会の20句・30句・50句など）を決め、↑↓で並べかえ。連作の中だけで句を直せて、元のストッ句はそのまま残ります。「味わう」で縦書きの通し読み。 <button class="link" data-act="page" data-p="renkan">ひらく</button></p>' +
      '<h3>句集づくり</h3><p>年・年度ごとの句集、入選・掲載の記録、SNSの自選十句（画像：地の色・書体・落款を選べる）、これまでの軌跡、note用の文、句帳に貼る紙片。かたちは、本の句集（A5・縦書き）、折本（A4一枚の豆本）、縦書きの一覧、画像、文。連作からも作れます（連作で直した形のまま）。 <button class="link" data-act="page" data-p="kushu">ひらく</button></p>' +

      '<h3>はじめに（先生がたのことば）</h3><p>夏井いつき・藤田湘子・芭蕉・虚子の「ええ言葉」の棚。俳筋トレ部屋の上にも、開くたびにちがう「きょうのひとこと」が出ます。 <button class="link" data-act="page" data-p="kokoro">ひらく</button></p>' +

      '<h3>評のトレーニング</h3><p>司会のダー浜（関西弁）と、評のコツ五つを5分で。例句の言葉を押していくと、評がひとつ組み上がります。 <button class="link" data-act="page" data-p="hyo">ひらく</button></p>' +
