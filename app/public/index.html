<html lang="ja">
<head>

<title>俳句の裾野</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* 一列の縦長。日替わりの一字題を上に置き、「ひとり（研鑽）」と「みんな（投句・選句）」を切り替える */
:root {
  --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;

  --ink: #2a2520;
  --ink-soft: #5d564c;
  --line: #e0d7c8;
  --accent: #1f7a63;
  --accent-ink: #ffffff;
  --accent-soft: #ddefe6;
  --accent2: #d96a2e;
  --accent2-soft: #fbe8d8;
  --tile1: #e9f4ec; --tile2: #fdf0dd; --tile3: #eef0fb; --tile4: #fdeaea;
  --warn: #8f5a0c;
  --warn-soft: #f4e6cc;
  --info: #35568a;
  --info-soft: #dbe4f2;
  --muted-soft: #e3e6e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131925; --paper: #1c2434; --ink: #e6e9ee; --ink-soft: #a5aebb; --line: #2c364a;
    --accent: #58c1a8; --accent-ink: #0c1a16; --accent-soft: #1c3a34;
    --accent2: #f09c62; --accent2-soft: #41301f;
    --tile1: #1d332a; --tile2: #3a2f1c; --tile3: #242c48; --tile4: #3b2428;
    --warn: #e0a550; --warn-soft: #3a2f1a; --info: #8fb0e8; --info-soft: #1f2c44; --muted-soft: #232c3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131925; --paper: #1c2434; --ink: #e6e9ee; --ink-soft: #a5aebb; --line: #2c364a;
  --accent: #58c1a8; --accent-ink: #0c1a16; --accent-soft: #1c3a34;
  --accent2: #f09c62; --accent2-soft: #41301f;
  --tile1: #1d332a; --tile2: #3a2f1c; --tile3: #242c48; --tile4: #3b2428;
  --warn: #e0a550; --warn-soft: #3a2f1a; --info: #8fb0e8; --info-soft: #1f2c44; --muted-soft: #232c3d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.75; padding-inline: 16px; }
.wrap { max-width: 680px; margin-inline: auto; padding-block: 20px 64px; display: flex; flex-direction: column; gap: 18px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

.tagline { font-size: .95rem; font-weight: 700; letter-spacing: .08em; color: var(--accent2); }
.date { font-family: var(--sans); font-size: 1.05rem; color: var(--ink-soft); }
.streak { font-size: .85rem; font-weight: 700; padding: .15em .8em; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.tan { background: var(--paper); border: 1px solid var(--line); border-radius: 2px; padding: 1rem .9rem; display: flex; justify-content: center; min-height: 8rem; box-shadow: 0 1px 0 var(--line); }
.ku { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 500; font-size: 1.2rem; line-height: 2; letter-spacing: .1em; }
.ku .seg { display: inline; }
.pv { max-width: none; }
.rem { font-weight: 700; font-size: .85rem; padding: .1em .75em; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.wel { display: flex; flex-direction: column; gap: 14px; }

.wans { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.sbar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 -1px 8px rgba(0,0,0,.08); }

.cnt2 { font-size: .9rem; font-weight: 700; padding: .25em .8em; border-radius: 99px; background: var(--muted-soft); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.slip.v-toku, .slip.v-nami { background: var(--accent-soft); border-radius: 12px; padding: 8px; }

.vbadge { font-size: .72rem; font-weight: 700; padding: .1em .7em; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }

.chip[disabled], .btn[disabled] { opacity: .5; cursor: default; }

.rbar { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }

.sec { margin: 0; font-family: var(--sans); font-weight: 700; font-size: 1.3rem; display: block; line-height: 1.8; }

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 14px 12px; }
.slip { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

      var sf = scur(); if (!sf || !ready() || sf.status !== 'selecting') return;
      var mv = (sf.votes || {})[myId] || {}, mvy = mv.yo || {};
      if (!mv.toku && !mv.nami && !Object.keys(mvy).some(function (k) { return mvy[k]; })) { toast('特選・並選・予選の、どれかひとつは選んでください'); return; }
      var fv = {}; fv[myId] = { fin: true };
      write(sf.id, { votes: fv });
    }
    else if (act === 'sunfin') {
      var sfu = scur(); if (!sfu || !ready() || sfu.status !== 'selecting') return;
      var fu = {}; fu[myId] = { fin: false };
      write(sfu.id, { votes: fu }).then(function () { toast('選びなおせます。もう一度決めたら「選を終了」を'); });
    }
    else if (act === 'close-select') { var sc = scur(); if (sc) write(sc.id, revealPatch(sc)); }
    else if (act === 'ctone') { var te = t.dataset.eid; cmTone[te] = cmTone[te] === t.dataset.v ? '' : t.dataset.v; render(); }
    else if (act === 'cpart') { var pe = t.dataset.eid, pl = cmPart[pe] || (cmPart[pe] = []), pi = pl.indexOf(t.dataset.v); if (pi >= 0) pl.splice(pi, 1); else pl.push(t.dataset.v); render(); }
    else if (act === 'comment') {
      var sm = scur(); if (!sm || !ready()) return;
      var eid2 = t.dataset.eid, text = String(cmDraft[eid2] || '').trim(), pts = (cmPart[eid2] || []).slice();
      if (!text && !pts.length) { toast('選評を入れるか、「どういうところを」を選んでください'); return; }
      markFirst('f_cm');
      var key = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var cobj = {}; cobj[key] = { eid: eid2, uid: myId, text: text.slice(0, 140), tone: cmTone[eid2] || '', part: pts, at: Date.now(), re: cmReply[eid2] || '' };
      cmDraft[eid2] = ''; cmTone[eid2] = ''; cmPart[eid2] = []; cmReply[eid2] = '';
      write(sm.id, { comments: cobj });
    }
    else if (act === 'finish') { var sf = scur(); if (sf) write(sf.id, { status: 'done' }); }
    else if (act === 'yaku-close') { var sy = scur(); if (sy) { yakuOpen[sy.id] = false; render(); } }
    else if (act === 'g-yaku-open') { gYakuShow = true; render(); }
    else if (act === 'g-yaku-close') { gYakuShow = false; try { localStorage.setItem('ikku-yaku-g', '1'); } catch (_) {} render(); }
    else if (act === 'yaku-open') { var sy2 = scur(); if (sy2) { yakuOpen[sy2.id] = true; render(); } }
    else if (act === 'k-stamp') {
      var ss2 = scur(); if (!ss2 || !ready()) return;
      if (!(ss2.entries && ss2.entries[myId])) { toast('スタンプは、句を出した人が押せます'); return; }
      var se2 = t.dataset.eid, sv2 = t.dataset.v; if (se2 === myId) return;
      var cur2 = ((ss2.stamps || {})[se2] || {})[myId];
      write(ss2.id, nest(['stamps', se2, myId], cur2 === sv2 ? null : sv2));
    }
    else if (act === 'cm-quick') {
      var sq = scur(); if (!sq || !ready()) return;
      if (!(sq.entries && sq.entries[myId])) return;
      var qe = t.dataset.eid, qv = String(t.dataset.v || '');
      var qk = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var qo = {}; qo[qk] = { eid: qe, uid: myId, text: qv, tone: 'やさしく', part: [], at: Date.now(), re: cmReply[qe] || '' };
      cmReply[qe] = '';
      markFirst('f_cm');
      write(sq.id, { comments: qo });
    }
    else if (act === 'cm-re') { cmReply[t.dataset.eid] = t.dataset.key; render(); var el2 = document.getElementById('cm-' + t.dataset.eid); if (el2) { try { el2.focus(); } catch (_) {} } }
    else if (act === 'cm-re-cancel') { cmReply[t.dataset.eid] = ''; render(); }
    else if (act === 'cm-like') {
      var sl = scur(); if (!sl || !ready()) return;
      if (!(sl.entries && sl.entries[myId])) { toast('「わかる」は、句を出した人が押せます'); return; }
      var lkey = t.dataset.key, lc = (sl.comments || {})[lkey]; if (!lc || lc.uid === myId) return;
      var lon = !!(lc.like && lc.like[myId]);
      write(sl.id, nest(['comments', lkey, 'like', myId], lon ? null : true));

  });
  function onInput(e) {
    var t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
    if (f.indexOf('g-') === 0) { gInput(f, t); return; }
    if (f === 'haigo') {
      haigo = t.value; try { localStorage.setItem('ikku-haigo', haigo); } catch (_) {}
      if (e.type === 'change') saveProf();
      if (e.type === 'change' && haigo.trim() && db && myId) sessions.forEach(function (x) {
        if (x.status !== 'done' && x.entries && x.entries[myId] && x.entries[myId].haigo !== haigo.trim()) { var hp = {}; hp[myId] = { haigo: haigo.trim() }; write(x.id, { entries: hp }); }
      });
    }
    else if (f === 'da') { if (demo && demo.step === 0) { if (demo.prep && kt(t.value, 'a') !== kt(demo.d.a, 'a')) demo.prep = false; demo.d.a = t.value; updateDemo(); } }
    else if (f === 'mq') { memoDraft = String(t.value || ''); }
    else if (f === 'tk-f') { if (tsuku) { var vv = String(t.value || ''); if (tsuku.step === 1 || tsuku.step === 2) { tsuku.phrase = vv; var ce = document.getElementById('tk-cnt'), mn = tkMora(vv); if (ce && mn >= 0) ce.textContent = mn; } else if (tsuku.step === 3) { tsuku.kigo = vv.trim() || tsuku.kigo; } } }
    else if (f === 'ta') { if (trial) { trial.d.a = t.value; trial.d.b = ''; trial.d.c = ''; updateTrial(); } }
    else if (f.indexOf('p-') === 0 && f !== 'p-haigo') { prof[f.slice(2)] = (f === 'p-x' || f === 'p-ig') ? hn(t.value) : t.value; if (e.type === 'change') { saveProf(); if (f === 'p-x' || f === 'p-ig' || f === 'p-sy' || f === 'p-sm') setTimeout(render, 0); } }
    else if (f === 'size') newSize = t.value;
    else if (f === 'iq-name') inq.name = t.value;
    else if (f === 'iq-text') inq.text = t.value;
    else if (f === 'rp') rpDraft[t.dataset.key] = t.value;
    else if (f === 'nw-title') nf.title = t.value;
    else if (f === 'nw-body') nf.body = t.value;
    else if (f === 'nw-url') nf.url = t.value;
    else if (f === 'cm') cmDraft[t.dataset.eid] = t.value;
    else if (f === 'ga' || f === 'gb' || f === 'gc') {
      var gs = scur(), gdr = gs && drafts['s:' + gs.id];
      if (gdr) { gdr[f.charAt(1)] = t.value; touched['s:' + gs.id] = 1; updateGForm(); }
    }
    else if (f === 'a' || f === 'b' || f === 'c') {
      var tg = target(), d = draftFor(tg); d[f] = t.value; touched[tg.id] = 1; updateForm();
    }
  }
  app.addEventListener('focusin', function (e) { var i = e.target && e.target.id; if (i && /^(f|g)-[abc]$/.test(i)) lastFld = i; });
  app.addEventListener('input', onInput);
  app.addEventListener('change', onInput);
  ['click', 'touchstart', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (ev === 'keydown') { if (e.key === 'Enter') markAct(); return; } var t = e.target; if (t && t.closest && !isTyping(t)) markAct(); }, true); });
  app.addEventListener('focusout', function () { if (!pendRender) return; clearTimeout(pendT); pendT = setTimeout(function () { if (pendRender && !isTyping(document.activeElement)) render(); }, 350); });

  /* ---- データの購読 ---- */
  function subShared() {
    unsubs.forEach(function (f) { try { f(); } catch (e) {} }); unsubs = [];
    var from = ds(dayNum() - 1);
    unsubs.push(db.collection('kukai').where('date', '>=', from).orderBy('date', 'desc').limit(60).onSnapshot(function (s) {
      sessions = s.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; }); stockSync(); histSync();
      if (hashSid && sessions.some(function (x) { return x.id === hashSid; })) { current = hashSid; tab = 'together'; hashSid = ''; }
      else if (hashSid && /^t\d{8}-\d\d$/.test(hashSid) && teiSlots().some(function (x) { return x.sid === hashSid; })) { var hs0 = hashSid; hashSid = ''; teiEnter(hs0, true); }
      closeStale(); checkCounts(); checkTransitions(); autoAdvance(); render();
    }, function () {}));
    subGohyo();
    try {
      unsubs.push(db.collection('news').orderBy('at', 'desc').limit(30).onSnapshot(function (sn) {
        news = sn.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; });
        if (!page || page === 'news' || page === 'admin') render();
      }, function () {}));
    } catch (e) {}
    try {
      var mc = db.collection('members');
      if (mc && mc.onSnapshot) unsubs.push(mc.onSnapshot(function (s) {
        var t0 = todayStartJST(); stat.members = s.docs.length; stat.joined = s.docs.filter(function (d) { var o = d.data() || {}; return (o.at || 0) >= t0; }).length; if (!page) render();
      }, function () {}));
      var g = db.doc('stats/global'); if (g && g.onSnapshot) unsubs.push(g.onSnapshot(function (d) { var o = (d && d.data && d.data()) || {}; stat.ku = o.ku || 0; if (!page) render(); }, function () {}));
      var dd = db.doc('stats/d-' + ds(dayNum())); if (dd && dd.onSnapshot) unsubs.push(dd.onSnapshot(function (d) { var o = (d && d.data && d.data()) || {}; stat.today = o.ku || 0; if (!page) render(); }, function () {}));
    } catch (e) {}
    if (isAdmin) subAdmin();
  }
  function subMine() {
    try {
      var pd = db.collection('data/users/' + myId).doc('profile');
      if (pd.onSnapshot) unsubs.push(pd.onSnapshot(function (d) {
        var o = d && d.data && d.data(); if (!o || !o.prof) return;
        for (var k in prof) if (typeof o[k] === 'string') prof[k] = o[k];
        if (o.haigo && !haigo) { haigo = o.haigo; try { localStorage.setItem('ikku-haigo', haigo); } catch (_) {} }
        if (page === 'my') return; render();
      }, function () {}));
    } catch (_) {}
    try {
      var fd = db.collection('data/users/' + myId).doc('firsts');
      if (fd.onSnapshot) unsubs.push(fd.onSnapshot(function (d) {
        var o = d && d.data && d.data(); if (!o || !o.firsts) return;
        for (var k in o) if (k.indexOf('f_') === 0 && typeof o[k] === 'number') firsts[k] = o[k];
        if (badgeSeen) badgeSeen = badgeIds();
        if (page === 'my') render();
      }, function () {}));
    } catch (_) {}
    db.collection('data/users/' + myId).orderBy('date', 'desc').limit(400).onSnapshot(function (s) {
      var all = s.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; });
      mine = all.filter(function (o) { return o.series; });
      memos = all.filter(function (o) { return o.memo; }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
      trophies = all.filter(function (o) { return o.trophy; });
      mineById = {}; mine.forEach(function (e) { mineById[e.id] = e; });
      hists = all.filter(function (o) { return o.hist; }); histById = {}; hists.forEach(function (o) { histById[o.rid] = 1; });
      mineReady = !(s.metadata && s.metadata.fromCache && !all.length); stockSync(); histSync();
      checkBadges(!!(s.metadata && s.metadata.fromCache));
      Object.keys(drafts).forEach(function (k) { if (!touched[k]) delete drafts[k]; });
      render();
    }, function () {});
  }

  setInterval(function () {
    var n = dayNum();
    if (n !== lastDay) { lastDay = n; ser = plan(n).series; drafts = {}; touched = {}; editing = null; if (db) subShared(); render(); return; }
    autoAdvance();
    try {
      var cds = document.querySelectorAll('[data-cd]');
      for (var ci2 = 0; ci2 < cds.length; ci2++) cds[ci2].textContent = cdText(Number(cds[ci2].getAttribute('data-cd')) - Date.now());
      if (teiSig() !== lastTeiSig && !trial && !demo && !page) render();
    } catch (_) {}
    var s = current && scur(); if (!s) return;
    if (s.status === 'reveal' && !s.opened) {
      var ci = cmtIdx(s);
      if (cmtSeen[s.id] !== undefined && cmtSeen[s.id] !== ci) { cmtSeen[s.id] = ci; if (ci < count(s) && s.entries && s.entries[myId]) notify('次の句の選評です（' + (ci + 1) + '/' + count(s) + '）'); render(); return; }
      cmtSeen[s.id] = ci;
      var oleft = Math.max(0, cmtSecS(s) - (Math.floor(cmtElapsed(s) / 1000) % cmtSecS(s)));
      var oc = document.getElementById('oclock'); if (oc) oc.textContent = fmt(oleft);
      var ob = document.getElementById('obar'); if (ob) ob.style.width = (oleft / cmtSecS(s) * 100).toFixed(1) + '%';
      if (ob) ob.style.background = oleft <= 60 ? 'var(--accent2)' : '';
      var lm = document.getElementById('lastmin'); if (lm) lm.style.display = oleft <= 60 ? '' : 'none';
      if (yakuOpen[s.id] === undefined && cmtElapsed(s) >= 45000 && document.querySelector('.yaku')) { yakuOpen[s.id] = false; render(); return; }
    }
    if (myId && db && s.status !== 'done' && s.status !== 'gathering' && !(s.entries && s.entries[myId])) {
      if (!watchAt[s.id] || Date.now() - watchAt[s.id] > 240000) { watchAt[s.id] = Date.now(); try { write(s.id, nest(['watch', myId], Date.now())); } catch (_) {} }
    }
    if (s.status === 'writing') {
      var wl = Math.max(0, WRITE_SEC - Math.floor((Date.now() - (s.writeStart || Date.now())) / 1000));
      var wc = document.getElementById('wclock'); if (wc) wc.textContent = fmt(wl);
    } else if (s.status === 'selecting') {
      var left = Math.max(0, selSec(s) - Math.floor((Date.now() - (s.selectStart || Date.now())) / 1000));
      var c = document.getElementById('clock'); if (c) c.textContent = fmt(left);
      var cb = document.getElementById('clockbar'); if (cb) cb.style.width = (left / selSec(s) * 100).toFixed(1) + '%';
    }
  }, 1000);

  render();
  try { if (localStorage.getItem('ikku-tut') === null) openWel(); } catch (e) {}
  (function init() {
    if (!window.claude || !window.claude.use) { dbState = 'none'; render(); return; }
    try { var hh = String(location.hash || '').replace(/^#/, ''); if (/^[A-Za-z0-9._~-]{4,80}$/.test(hh)) hashSid = hh; } catch (e) {}
    try {
      window.claude.use('room').then(function (room) {
        if (!room) return;
        try { room.presence({ here: 1 }); } catch (e) {}
        room.onPeers(function (ch) {
          online = ch.peers.length; 
          var fresh = ch.joined.filter(function (q) { return !q.isMe; });
          if (fresh.length && Date.now() - roomT0 > 4000) {
            var sw = sessions.some(function (x) { return x.status === 'gathering' && x.entries && x.entries[myId]; });
            if (sw) notify('だれかが来ました。いま ' + online + ' 人がひらいています');
          }
          if (!page && !tut.open) render();
        });
      }).catch(function () {});
    } catch (e) {}
    window.claude.use('user').then(function (u) {
      if (!u) return null;
      try { Promise.resolve(u.isOwner && u.isOwner()).then(function (o) { if (o) { isAdmin = true; if (db) subAdmin(); render(); } }).catch(function () {}); } catch (e) {}
      return u.id();
    }).catch(function () { return null; }).then(function (id) {
      myId = id; return window.claude.use('db');
    }).then(function (d) {
      db = d;
      if (!db) { dbState = 'none'; render(); return; }
      dbState = 'ok';
      subShared();
      if (myId) { subMine(); subInq(); try { db.collection('members').doc(myId).set({ at: Date.now() }, { merge: true }).catch(function () {}); } catch (e) {} }
      render();
    }).catch(function () { dbState = 'none'; render(); });
  })();
})();
